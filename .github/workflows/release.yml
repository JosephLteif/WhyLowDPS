name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Release source branch (must be master)"
        required: true
        default: master
        type: string
      release_type:
        description: "Semantic version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version-stable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Require master release source
        shell: bash
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "${SOURCE_REF}" != "master" ]]; then
            echo "Stable releases must be created from master."
            exit 1
          fi

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ci --prefix frontend

      - name: Bump VERSION and sync files
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(tr -d '\r\n' < VERSION)"
          echo "Current version: ${CURRENT_VERSION}"
          NEW_VERSION="$(npm version "${{ github.event.inputs.release_type }}" --no-git-tag-version | sed 's/^v//')"
          echo "${NEW_VERSION}" > VERSION
          npm run sync:version
          npm install --package-lock-only
          npm install --package-lock-only --prefix frontend
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate synchronized release version
        run: npm run verify:release -- "${{ steps.bump.outputs.new_version }}"

      - name: Commit and tag release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json frontend/package.json Cargo.toml backend/Cargo.toml desktop/src-tauri/tauri.conf.json desktop/src-tauri/tauri.docker.conf.json package-lock.json frontend/package-lock.json Cargo.lock backend/Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes detected; skipping commit/tag."
            exit 0
          fi
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin master
          git push origin "v${{ steps.bump.outputs.new_version }}"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: "windows-latest"
            args: "--config src-tauri/tauri.conf.json --bundles nsis"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - name: install dependencies
        run: npm ci && npm ci --prefix frontend

      - name: Validate release version from tag
        shell: bash
        run: npm run verify:release -- "${GITHUB_REF_NAME#v}"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target

      - name: Cache Next build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-release-${{ hashFiles('frontend/package-lock.json', 'frontend/tsconfig.json', 'frontend/tailwind.config.ts', 'frontend/next.config.js', 'frontend/next.config.mjs', 'frontend/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-release-

      - name: Ensure bundled resource paths exist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/resources/data
          if [[ ! -f backend/resources/zones-encounters-index.json ]]; then
            echo "backend/resources/zones-encounters-index.json is required for release bundles"
            exit 1
          fi
          for file in wow-expansions.json wow-instances.json wow-encounters.json wow-seasons.json; do
            if [[ ! -f "backend/resources/wow/$file" ]]; then
              echo "backend/resources/wow/$file is required for release bundles"
              exit 1
            fi
          done
          cp backend/resources/zones-encounters-index.json backend/resources/data/zones-encounters-index.json
          touch backend/resources/data/.keep

      - name: Build and release desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DESKTOP_BUILD: true
          NEXT_PUBLIC_DESKTOP_BUILD: true
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "WhyLowDps ${{ github.ref_name }}"
          releaseBody: "Release assets uploaded. Checksums will be added automatically."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload zones encounters index asset
        if: matrix.platform == 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" backend/resources/zones-encounters-index.json --clobber

  publish-container:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/josephlteif/whylowdps
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable

      - name: Build private-hosting image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WHYLOWDPS_DEPLOYMENT=hosted-private

      - name: Smoke test container
        shell: bash
        env:
          IMAGE: ghcr.io/josephlteif/whylowdps:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          CONTAINER="whylowdps-release-smoke"
          cleanup() {
            docker logs "${CONTAINER}" 2>&1 || true
            docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${CONTAINER}" \
            --publish 127.0.0.1:18000:8000 \
            --env ALLOW_EXTERNAL_BIND=true \
            --env JWT_SECRET=release-smoke-secret-012345678901234567890123 \
            --env WHYLOWDPS_SECURE_COOKIES=false \
            "${IMAGE}"

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy"
          exit 1

      - name: Push release image tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r IMAGE; do
            [[ -z "${IMAGE}" ]] || docker push "${IMAGE}"
          done <<< "${IMAGE_TAGS}"

      - name: Record published image digest
        id: digest
        shell: bash
        env:
          IMAGE: ghcr.io/josephlteif/whylowdps:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}" | awk '/Digest:/ {print $2; exit}')"
          if [[ -z "${DIGEST}" ]]; then
            echo "Unable to determine published image digest"
            exit 1
          fi
          echo "image_digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

  finalize-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Upload private-hosting release bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish-container.outputs.image_digest }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BUNDLE_DIR="$(mktemp -d)"
          cp compose.yaml "${BUNDLE_DIR}/compose.yaml"
          sed "s/^WHYLOWDPS_VERSION=.*/WHYLOWDPS_VERSION=${VERSION}/" \
            .env.docker.example > "${BUNDLE_DIR}/.env.docker.example"
          cp docs/docker-hosting.md "${BUNDLE_DIR}/docker-hosting.md"
          printf 'ghcr.io/josephlteif/whylowdps:%s\n' "${VERSION}" > "${BUNDLE_DIR}/docker-image.txt"
          printf 'ghcr.io/josephlteif/whylowdps@%s\n' "${IMAGE_DIGEST}" >> "${BUNDLE_DIR}/docker-image.txt"
          gh release upload "${TAG}" \
            "${BUNDLE_DIR}/compose.yaml" \
            "${BUNDLE_DIR}/.env.docker.example" \
            "${BUNDLE_DIR}/docker-hosting.md" \
            "${BUNDLE_DIR}/docker-image.txt" \
            --clobber

      - name: Generate release checksums and notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TMP_DIR="$(mktemp -d)"
          NOTES_FILE="${TMP_DIR}/release-notes.md"
          CHECKSUM_FILE="${TMP_DIR}/checksums.txt"
          ASSET_LIST_FILE="${TMP_DIR}/assets.txt"

          gh release download "${TAG}" --dir "${TMP_DIR}"

          mapfile -t ASSET_FILES < <(find "${TMP_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#ASSET_FILES[@]}" -eq 0 ]]; then
            echo "No release assets found for ${TAG}"
            exit 1
          fi

          : > "${CHECKSUM_FILE}"
          : > "${ASSET_LIST_FILE}"
          for FILE in "${ASSET_FILES[@]}"; do
            HASH="$(sha256sum "${TMP_DIR}/${FILE}" | awk '{print $1}')"
            printf '%s  %s\n' "${FILE}" "${HASH}" >> "${CHECKSUM_FILE}"
            printf '%s\n' "${FILE}" >> "${ASSET_LIST_FILE}"
          done

          node scripts/release-notes.js \
            --version "${VERSION}" \
            --assets-file "${ASSET_LIST_FILE}" \
            --checksums-file "${CHECKSUM_FILE}" \
            --output "${NOTES_FILE}"

          gh release edit "${TAG}" --notes-file "${NOTES_FILE}"

      - name: Publish completed release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

      - name: Notify Discord release channel
        shell: bash
        env:
          CHANNEL: stable
          TAG: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          STABLE_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_STABLE }}
        run: |
          set -euo pipefail
          node scripts/notify-discord-release.js
